services:
  backend:
    build: .
    container_name: pca_plot_assistant
    volumes:
      - .:/app
      - /app/node_modules # Protects modules installed inside the container
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      # Use env variables to connect to external DB (host).
      - DATABASE_URL=postgresql://${PSQL_USER}:${PSQL_PASSWORD}@${PSQL_HOSTNAME}:${PSQL_LOCAL_PORT}/${PSQL_DBNAME}?schema=public
    depends_on:
      ollama:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  ollama:
    image: ollama/ollama:latest
    container_name: pca_plot_ollama
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./pca-plot-frontend
    container_name: pca_plot_frontend
    working_dir: /app
    volumes:
      - ./pca-plot-frontend:/app
      - /app/node_modules
    ports:
      - "4200:4200"
    environment:
      - CHOKIDAR_USEPOLLING=true

volumes:
  ollama_data:
